<!DOCTYPE html>
<html lang="en">
<head>
    </head>
<body>
    <div id="sidebar">
        <h2>Device UI Simulators</h2>
        <ul>
            <li class="menu-item" onclick="loadSharpSimulator()">Sharp BP-71C31</li>
        </ul>
    </div>
    
    <div id="viewer-container">
        <iframe id="sim-frame" src="about:blank"></iframe>
    </div>

    <script>
        // 1. THIS IS THE VARIABLE
        // Use backticks (`) to start and end the string.
        const SIMULATOR_HTML = `
            <!DOCTYPE html>
            <html lang="en-us">
            </html>
        `;

        // 2. THIS IS THE FUNCTION
        function loadSharpSimulator() {
            const frame = document.getElementById('sim-frame');
            frame.style.display = 'block';
            
            // This 'srcdoc' property tells the iframe to render the string 
            // as if it were a full HTML document.
            frame.srcdoc = SIMULATOR_HTML;
        }
    </script>
</body>
</html>
