<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technician Web UI Simulator Hub</title>
    <script src="./ui.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; background-color: #f5f5f7; }
        #sidebar { width: 280px; background-color: #1e1e24; color: #fff; display: flex; flex-direction: column; }
        #sidebar h2 { padding: 20px; margin: 0; font-size: 1.2rem; background-color: #141418; }
        .menu-item { padding: 15px 20px; cursor: pointer; border-bottom: 1px solid #2e2e38; }
        .menu-item:hover { background-color: #2a2a35; }
        .menu-item.active { background-color: #007aff; }
        #viewer-container { flex-grow: 1; position: relative; }
        #placeholder { display: flex; justify-content: center; align-items: center; height: 100%; color: #666; }
        replay-web-page { width: 100%; height: 100%; display: none; }
        #not-available {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            z-index: 999;
        }
        #not-available h2 { margin: 0 0 10px; color: #333; }
        #not-available p { margin: 0 0 20px; color: #666; }
        #not-available button {
            background: #007aff;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }
        #not-available button:hover { background: #005ecb; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Device UI Simulators</h2>
        <ul class="menu-list">
            <li class="menu-item"
                data-src="https://remotevideosource-glitch.github.io/WEBUI/sharp-bp-71c31.wacz"
                data-url="http://10.1.16.241/main.html">Sharp BP-71C31</li>
        </ul>
    </div>
    <div id="viewer-container">
        <div id="placeholder"><h3>Select a machine UI to begin.</h3></div>
        <replay-web-page
            id="sim-viewer"
            embed="replayonly">
        </replay-web-page>
        <div id="not-available">
            <h2>Page Not Available</h2>
            <p>This page was not captured in the simulator archive.</p>
            <button onclick="dismissNotAvailable()">Go Back</button>
        </div>
    </div>
    <script>
        const menuItems = document.querySelectorAll('.menu-item');
        const container = document.getElementById('viewer-container');
        const placeholder = document.getElementById('placeholder');
        const notAvailable = document.getElementById('not-available');
        
        let viewer = document.getElementById('sim-viewer');
        let lastGoodUrl = '';
        let isReverting = false;

        // Runtime hook injection into the Replay Web Page component internals
        customElements.whenDefined('replay-web-page').then(() => {
            const ReplayWebPageClass = customElements.get('replay-web-page');
            const originalOnLoad = ReplayWebPageClass.prototype.onLoad;

            ReplayWebPageClass.prototype.onLoad = function(event) {
                // Execute component's original rendering setup code first
                originalOnLoad.call(this, event);

                try {
                    const iframe = event.target;
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

                    if (iframeDoc) {
                        const scanForErrors = () => {
                            if (isReverting) return;
                            
                            const text = iframeDoc.body ? iframeDoc.body.innerText : '';
                            if (text.includes('Archived Page Not Found') || 
                                text.includes('not found in this archive') || 
                                text.includes('Sorry, this page was not found')) {
                                console.warn("Observer intercepted internal 404 error page state.");
                                revertToSafeState();
                            }
                        };

                        // Check instantly upon loading the wrapper frame
                        scanForErrors();

                        // Use a MutationObserver to watch the Service Worker manipulate the internal document DOM asynchronously
                        const observer = new MutationObserver(() => {
                            scanForErrors();
                        });

                        observer.observe(iframeDoc.documentElement, {
                            childList: true,
                            subtree: true
                        });
                    }
                } catch (e) {
                    // Fallback to safety if strict inner cross-origin security is encountered
                    revertToSafeState();
                }
            };
            console.log("Internal components successfully patched with structural error protection.");
        });

        function dismissNotAvailable() {
            notAvailable.style.display = 'none';
            revertToSafeState();
        }

        function revertToSafeState() {
            if (isReverting) return;
            isReverting = true;
            
            console.warn("Unmapped route hit! Hot-rebuilding simulator to last safe page:", lastGoodUrl);
            
            const activeItem = document.querySelector('.menu-item.active');
            if (!activeItem) { isReverting = false; return; }

            const waczUrl = activeItem.getAttribute('data-src');
            const targetUrl = lastGoodUrl || activeItem.getAttribute('data-url');

            // Force-destroy the locked custom component element
            viewer.remove();

            // Rebuild a clean, pristine instance to flush the error state
            const newViewer = document.createElement('replay-web-page');
            newViewer.id = 'sim-viewer';
            newViewer.setAttribute('embed', 'replayonly');
            newViewer.style.display = 'block';
            newViewer.setAttribute('source', waczUrl);
            newViewer.setAttribute('url', targetUrl);

            attachViewerListeners(newViewer);
            container.insertBefore(newViewer, notAvailable);
            viewer = newViewer;

            setTimeout(() => { isReverting = false; }, 400);
        }

        function checkForNotFound() {
            if (isReverting) return;

            const shadow = viewer.shadowRoot;
            if (!shadow) return;
            const iframe = shadow.querySelector('iframe');
            if (!iframe) return;

            // --- CHECK 1: Back-up Frame Body Content Scan ---
            let bodyText = '';
            try {
                if (iframe.contentDocument && iframe.contentDocument.body) {
                    bodyText = iframe.contentDocument.body.innerText || '';
                }
            } catch (e) {
                revertToSafeState();
                return;
            }

            if (bodyText.includes('Archived Page Not Found') || 
                bodyText.includes('not found in this archive') || 
                bodyText.includes('Sorry, this page was not found')) {
                revertToSafeState();
                return;
            }

            // --- CHECK 2: Frame Navigation Query Param Scan ---
            let currentIframeUrl = '';
            try {
                if (iframe.contentWindow) {
                    currentIframeUrl = iframe.contentWindow.location.href || '';
                }
            } catch (e) {
                revertToSafeState();
                return;
            }

            if (currentIframeUrl.includes('__wb_method=POST')) {
                revertToSafeState();
                return;
            }
        }

        // High frequency polling loop safety valve
        setInterval(checkForNotFound, 100);

        function attachViewerListeners(element) {
            element.addEventListener('urlchange', (e) => {
                if (isReverting) return;
                
                if (e.detail && e.detail.url) {
                    if (e.detail.url.includes('__wb_method=POST')) {
                        setTimeout(revertToSafeState, 0);
                    } else {
                        // Store this as our baseline fallback location
                        lastGoodUrl = e.detail.url;
                    }
                }
            });

            element.addEventListener('warc-copy-failed', (e) => { e.preventDefault(); revertToSafeState(); });
            element.addEventListener('render-failed', (e) => { e.preventDefault(); revertToSafeState(); });
            element.addEventListener('error', (e) => { e.preventDefault(); revertToSafeState(); });
        }

        // Initialize the tracking engine
        attachViewerListeners(viewer);

        menuItems.forEach(item => {
            item.addEventListener('click', () => {
                menuItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                
                const waczUrl = item.getAttribute('data-src');
                const startUrl = item.getAttribute('data-url');
                
                lastGoodUrl = startUrl; 
                isReverting = false;
                
                placeholder.style.display = 'none';
                notAvailable.style.display = 'none';
                viewer.style.display = 'block';
                viewer.setAttribute('source', waczUrl);
                viewer.setAttribute('url', startUrl);
            });
        });
    </script>
</body>
</html>
