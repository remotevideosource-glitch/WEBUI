<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technician Web UI Simulator Hub</title>
    
    <script src="https://cdn.jsdelivr.net/npm/replaywebpage@1.8.12/ui.js"></script>

    <style>
        body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; background-color: #f5f5f7; }
        #sidebar { width: 280px; background-color: #1e1e24; color: #fff; display: flex; flex-direction: column; }
        #sidebar h2 { padding: 20px; margin: 0; font-size: 1.2rem; background-color: #141418; }
        .menu-item { padding: 15px 20px; cursor: pointer; border-bottom: 1px solid #2e2e38; }
        .menu-item:hover { background-color: #2a2a35; }
        .menu-item.active { background-color: #007aff; }
        #viewer-container { flex-grow: 1; position: relative; }
        #placeholder { display: flex; justify-content: center; align-items: center; height: 100%; color: #666; }
        replay-web-page { width: 100%; height: 100%; display: none; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Device UI Simulators</h2>
        <ul class="menu-list">
            <li class="menu-item" data-src="sharp-bp-71c31.wacz">Sharp BP-71C31</li>
        </ul>
    </div>

    <div id="viewer-container">
        <div id="placeholder"><h3>Select a machine UI to begin.</h3></div>

        <replay-web-page
            id="sim-viewer"
            embed="replayonly"
            replaybase="https://cdn.jsdelivr.net/npm/replaywebpage@1.8.12/"
            swname="sw.js">
        </replay-web-page>
    </div>

    <script>
        const menuItems = document.querySelectorAll('.menu-item');
        const viewer = document.getElementById('sim-viewer');
        const placeholder = document.getElementById('placeholder');

        menuItems.forEach(item => {
            item.addEventListener('click', () => {
                menuItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');

                const waczUrl = item.getAttribute('data-src');
                placeholder.style.display = 'none';
                viewer.style.display = 'block';

                viewer.setAttribute('url', waczUrl);
            });
        });

        viewer.addEventListener('warc-copy-failed', (e) => e.preventDefault());
        viewer.addEventListener('render-failed', (e) => e.preventDefault());
    </script>
</body>
</html>
